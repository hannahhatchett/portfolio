<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hannah Hatchett — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="canvas.css?v=2" />
</head>
<body>
  <header class="site-nav">
    <a href="index.html" class="site-nav-name">Hannah Hatchett</a>
    <nav class="site-nav-links">
      <a href="index.html" class="active">Work</a>
      <a href="playground.html">Play</a>
      <a href="about.html">About</a>
      <a href="hannah-hatchett-cv.pdf" target="_blank" rel="noopener">CV</a>
    </nav>
  </header>

  <main id="home">
    <!-- ============ Hero (kept from before) ============ -->
    <div class="main">
      <section class="hero reveal" aria-label="Intro">
        <h2 class="hero-title">
          I'm all about AI,<br />
          interaction, and<br />
          <span class="selected-word selected-word-cycler">
            <span class="selection-handle tl"></span>
            <span class="selection-handle tr"></span>
            <span class="selection-handle bl"></span>
            <span class="selection-handle br"></span>
            <span class="selected-word-text" aria-live="polite"><em>fun</em></span>
            <span class="cursor-tag cursor-tag-hero" aria-hidden="true">
              <svg viewBox="0 0 16 16">
                <path d="M2 1 L2 13 L5.5 10 L7.8 14.2 L9.6 13.4 L7.3 9.2 L11.5 9.2 Z"
                      fill="#1a73ff" stroke="#fff" stroke-width="0.8" stroke-linejoin="round" />
              </svg>
              <span class="cursor-pill">Hannah</span>
            </span>
          </span>
        </h2>
      </section>
    </div>

    <!-- ============ Selected work — node canvas ============ -->
    <section class="cv-section-wrap" aria-label="Selected work">
      <div class="cv-section">
        <!-- Left: rotatable device model of the active project -->
        <div class="cv-feature">
          <div class="cv-stage3d">
            <div class="cv-device" aria-hidden="true">
              <div class="cv-monitor">
                <span class="cv-monitor-cam"></span>
                <div class="device-screen"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: node canvas -->
        <div class="cv-canvas">
          <div class="cv-stage">
            <svg class="cv-wires" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js?v=2"></script>
  <script src="canvas.js?v=2"></script>
</body>
</html>
